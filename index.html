<!DOCTYPE html>
<html>
<head>
    <title>Day and Night Toggle</title>
    <style>
        body {
            background: white;
            color: black;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px;
        }
        
#theme-toggle-button {
  display: inline-block;
  width: 70px;
  cursor: pointer;
}

#toggle {
  opacity: 0;
  width: 0;
  height: 0;
}

svg {
  width: 70px;
}

#container {
  fill: #b9d8f5;
}

#button {
  fill: white;
  transition: transform 0.25s;
}

    </style>
</head>
<body>
    <h1>Day and Night Themes</h1>

    
<label id="theme-toggle-button">
  <input type="checkbox" id="toggle">
  <svg viewBox="0 0 70 44"
       xmlns="http://www.w3.org/2000/svg">
    <rect id="container"
          width="70"
          height="44"
          rx="22"/>
    <circle id="button"
            cx="22"
            cy="22"
            r="18"/>
    <circle id="sun"
            cx="22"
            cy="22"
            r="7"
            fill="#f1c40f"/>
    <circle id="moon"
            cx="50"
            cy="22"
            r="7"
            fill="#f1c40f"/>
  </svg>
</label>

</html>
